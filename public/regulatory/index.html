<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regulatory Reporting — India Banking Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B2A;--navy2:#162233;--navy3:#1E3048;
  --red:#E31837;--red-dk:#B01229;
  --white:#FFFFFF;--off:#F4F6FA;--border:#E2E8F0;
  --t1:#0D1B2A;--t2:#4A5568;--t3:#8A9AB0;
  --green:#10B981;--amber:#F59E0B;--blue:#3B82F6;--sidebar:290px;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--off);color:var(--t1);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOP BAR */
.topnav{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:15}
.topnav-left{display:flex;align-items:center;gap:16px}
.topnav-title{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:15px;color:var(--t1)}
.topnav-date{font-size:11px;color:var(--t3);font-family:'IBM Plex Mono',monospace}
.btn{padding:8px 16px;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--t2);transition:all 0.18s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn-primary:hover{background:var(--red-dk);color:#fff;border-color:var(--red-dk)}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;z-index:20}
.sidebar::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(227,24,55,0.07) 0%,transparent 60%),radial-gradient(ellipse at 90% 80%,rgba(26,107,255,0.05) 0%,transparent 60%);pointer-events:none}
.sidebar-header{padding:18px 22px 14px;border-bottom:1px solid rgba(255,255,255,0.07);position:relative;z-index:1}
.home-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:rgba(255,255,255,0.5);font-size:11px;margin-bottom:12px;letter-spacing:0.5px}
.home-link:hover{color:rgba(255,255,255,0.8)}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-mark{width:36px;height:36px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(227,24,55,0.4)}
.logo-name{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:13px;color:#fff;line-height:1.2}
.logo-sub{font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:0.8px;text-transform:uppercase;margin-top:1px}
.sidebar-scroll{flex:1;overflow-y:auto;scrollbar-width:none;position:relative;z-index:1}
.sidebar-scroll::-webkit-scrollbar{display:none}
.sec-label{padding:14px 22px 6px;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.25)}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:2px 10px;border-radius:9px;cursor:pointer;transition:background 0.15s;border:1px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.05)}
.nav-item.active{background:rgba(227,24,55,0.13);border-color:rgba(227,24,55,0.28)}
.nav-item.active .ni-label{color:#fff}
.ni-icon{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-item.active .ni-icon{background:var(--red);box-shadow:0 2px 8px rgba(227,24,55,0.4)}
.ni-text{flex:1;min-width:0}
.ni-label{font-size:12.5px;font-weight:500;color:rgba(255,255,255,0.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-sub{font-size:10px;color:rgba(255,255,255,0.3);margin-top:1px}
.ni-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ni-dot.Compliant{background:var(--green);box-shadow:0 0 5px rgba(16,185,129,0.6)}
.ni-dot.Watch{background:var(--amber);box-shadow:0 0 5px rgba(245,158,11,0.6)}
.ni-dot.Breach{background:var(--red);box-shadow:0 0 5px rgba(227,24,55,0.6)}
.client-box{padding:10px 14px 4px;position:relative;z-index:1}
.client-input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px}
.client-input::placeholder{color:rgba(255,255,255,0.35)}
.client-input:focus{outline:none;border-color:var(--red)}
.sidebar-footer{padding:12px 22px;border-top:1px solid rgba(255,255,255,0.06);font-size:9px;color:rgba(255,255,255,0.22);position:relative;z-index:1}

/* MAIN */
.main{flex:1;overflow-y:auto;min-width:0}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.content{padding:26px 34px 50px;display:flex;flex-direction:column;gap:26px;max-width:1300px}
.sl{font-size:9.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-title{font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:26px;color:var(--t1);letter-spacing:-0.5px}
.page-desc{font-size:13px;color:var(--t3);margin-top:4px;max-width:640px;line-height:1.55}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi-card{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%}
.kpi-card.green::before{background:var(--green)}.kpi-card.amber::before{background:var(--amber)}
.kpi-card.red::before{background:var(--red)}.kpi-card.blue::before{background:var(--blue)}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--t3)}
.kpi-value{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:30px;color:var(--t1);margin-top:8px;line-height:1}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:7px}
.kpi-badge{position:absolute;top:16px;right:16px;font-size:9px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:0.4px}

/* STATUS BADGE */
.badge{font-size:9.5px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:0.3px;display:inline-block}
.badge.Compliant{background:#D1FAE5;color:#065F46}
.badge.Watch{background:#FEF3C7;color:#92400E}
.badge.Breach{background:#FEE2E2;color:#991B1B}
.badge.Monitored{background:#DBEAFE;color:#1E40AF}

/* CARD + GRID */
.card{background:#fff;border-radius:14px;padding:22px 24px;border:1px solid var(--border)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card-title{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:15px;color:var(--t1);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.card-sub{font-size:11px;color:var(--t3);margin-bottom:18px}

/* RATIO BAR */
.ratio{margin-bottom:18px}
.ratio:last-child{margin-bottom:0}
.ratio-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.ratio-name{font-size:12px;font-weight:600;color:var(--t2)}
.ratio-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.ratio-track{position:relative;height:9px;background:var(--off);border-radius:6px;overflow:visible}
.ratio-fill{height:100%;border-radius:6px;transition:width 0.5s ease}
.ratio-fill.Compliant{background:linear-gradient(90deg,#34D399,#10B981)}
.ratio-fill.Watch{background:linear-gradient(90deg,#FBBF24,#F59E0B)}
.ratio-fill.Breach{background:linear-gradient(90deg,#F87171,#E31837)}
.ratio-marker{position:absolute;top:-3px;width:2px;height:15px;background:var(--t1);opacity:0.55}
.ratio-marker::after{content:attr(data-label);position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:8.5px;color:var(--t3);white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.ratio-foot{display:flex;justify-content:space-between;margin-top:18px;font-size:10px;color:var(--t3)}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:9px 12px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--t3);border-bottom:2px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--t2)}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--t1)}
.tbl .th-num{text-align:right}
.tbl-clickable tr{cursor:pointer;transition:background 0.12s}
.tbl-clickable tbody tr:hover{background:var(--off)}
.bank-name-cell{font-weight:600;color:var(--t1)}

/* STAT ROW */
.statline{display:flex;flex-wrap:wrap;gap:26px}
.stat{min-width:120px}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--t3)}
.stat-value{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:18px;color:var(--t1);margin-top:5px}
.stat-value small{font-size:11px;color:var(--t3);font-weight:400}

/* ASSUMPTIONS */
.assume{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:14px 16px;font-size:11px;color:#92400E;line-height:1.6}
.assume strong{font-weight:700}
.assume-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* CHART */
.chart-box{position:relative;height:230px}
.empty{padding:60px 20px;text-align:center;color:var(--t3)}
.loading{padding:80px;text-align:center;color:var(--t3);font-size:13px}
.spinner{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,0.25);opacity:0;transform:translateY(10px);transition:all 0.3s;z-index:100;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-left:3px solid var(--green)}.toast.error{border-left:3px solid var(--red)}
@media(max-width:1000px){.kpi-grid{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="topnav">
  <div class="topnav-left">
    <span class="topnav-title">📋 Regulatory Reporting</span>
    <span class="topnav-date" id="reportDate"></span>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <a href="/operations/multibank" class="btn">🏦 Operations</a>
    <button class="btn btn-primary" id="runBtn" onclick="runBatch()">↻ Run Batch</button>
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/" class="home-link">← Platform Home</a>
      <div class="logo-row">
        <div class="logo-mark">RR</div>
        <div>
          <div class="logo-name">Regulatory Reporting</div>
          <div class="logo-sub">Basel III · RBI Returns</div>
        </div>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sec-label">Supervisory View</div>
      <div class="nav-item active" id="nav-system" onclick="showSystem()">
        <div class="ni-icon">🌐</div>
        <div class="ni-text"><div class="ni-label">India System</div><div class="ni-sub">All banks consolidated</div></div>
      </div>
      <div class="sec-label">Banks</div>
      <div id="bankNav"></div>
      <div class="sec-label">Client Regulatory Report</div>
      <div class="client-box">
        <input class="client-input" id="clientSearch" list="clientList" placeholder="Search customer name / ID…" onchange="lookupClient(this.value)">
        <datalist id="clientList"></datalist>
      </div>
    </div>
    <div class="sidebar-footer" id="sidebarFoot">Regulatory Reporting · India Intelligence Platform</div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div><div>Loading regulatory reports…</div></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
// ── STATE ───────────────────────────────────────────────────────────────────
let SYS = null;          // system snapshot
let CUSTOMERS = [];      // for client lookup
const charts = {};
function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); Object.keys(charts).forEach(k=>delete charts[k]); }

// ── UTILS ───────────────────────────────────────────────────────────────────
const C = '#0D1B2A';
function inr(n){ if(n==null) return '—'; const a=Math.abs(n);
  if(a>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if(a>=1e5) return '₹'+(n/1e5).toFixed(2)+' L';
  return '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0}); }
const pct = n => n==null ? '—' : Number(n).toFixed(2)+'%';
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// RBI Schedule III (Form A) balance sheet — periods as columns, assets vs liabilities.
function renderBalanceSheet(sheets){
  if(!sheets || !sheets.length) return '';
  const periods = sheets.slice().reverse();   // oldest → newest
  const head = periods.map(p=>`<th class="th-num">${esc(p.period)}</th>`).join('');
  const row = (label,key,opt={})=>`<tr style="${opt.strong?'font-weight:700;border-top:1.5px solid var(--border)':''}">
    <td style="${opt.indent?'padding-left:20px;color:var(--t3);font-size:11px':''}">${esc(label)}</td>
    ${periods.map(p=>`<td class="num">${inr(p[key])}</td>`).join('')}</tr>`;
  const liab = `<table class="tbl"><thead><tr><th>Capital &amp; Liabilities</th>${head}</tr></thead><tbody>
    ${row('Equity Share Capital','equity_capital')}
    ${row('Reserves & Surplus','reserves_surplus')}
    ${row('Deposits','total_deposits')}
    ${row('— Demand deposits','deposits_demand',{indent:true})}
    ${row('— Savings deposits','deposits_savings',{indent:true})}
    ${row('— Term deposits','deposits_term',{indent:true})}
    ${row('Borrowings','borrowings')}
    ${row('Other Liabilities & Provisions','other_liabilities')}
    ${row('Total Capital & Liabilities','total_liabilities_capital',{strong:true})}
  </tbody></table>`;
  const assets = `<table class="tbl"><thead><tr><th>Assets</th>${head}</tr></thead><tbody>
    ${row('Cash & Balances with RBI','cash_with_rbi')}
    ${row('Balances with Banks / Money at Call','balances_with_banks')}
    ${row('Investments','investments')}
    ${row('Advances (net)','advances_net')}
    ${row('Fixed Assets','fixed_assets')}
    ${row('Other Assets','other_assets')}
    ${row('Total Assets','total_assets',{strong:true})}
  </tbody></table>`;
  const latest = periods[periods.length-1];
  return `<div>
    <div class="sl">Balance Sheet — RBI Schedule III (Form A)</div>
    <div class="card">
      <div class="card-title">Statement of Financial Position</div>
      <div class="card-sub">As at ${esc(latest.as_on_date)} · ₹ (INR) · the latest period's capital base &amp; HQLA feed the CRAR/LCR above</div>
      <div class="grid-2">${liab}${assets}</div>
      <div class="ratio-foot">
        <span>Contingent liabilities ${inr(latest.contingent_liabilities)}</span>
        <span>Bills for collection ${inr(latest.bills_for_collection)}</span>
      </div>
    </div>
  </div>`;
}
const statusColor = s => ({Compliant:'green',Watch:'amber',Breach:'red',Monitored:'blue'}[s]||'blue');

// horizontal ratio bar: actual vs regulatory minimum (minimum sits at 50% of track)
function ratioBar(name, actual, min, status){
  const scaleMax = min*2;
  const fillPct = Math.max(2, Math.min(100, (actual/scaleMax)*100));
  const valColor = status==='Breach'?'var(--red)':status==='Watch'?'var(--amber)':'var(--green)';
  return `<div class="ratio">
    <div class="ratio-head">
      <span class="ratio-name">${name}</span>
      <span><span class="ratio-val" style="color:${valColor}">${pct(actual)}</span> <span class="badge ${status}" style="margin-left:8px">${status}</span></span>
    </div>
    <div class="ratio-track">
      <div class="ratio-fill ${status}" style="width:${fillPct}%"></div>
      <div class="ratio-marker" style="left:50%" data-label="min ${min}%"></div>
    </div>
  </div>`;
}

function showToast(msg, type='success'){
  const t=document.getElementById('toast');
  t.className='toast '+type; document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200);
}

// ── INIT ────────────────────────────────────────────────────────────────────
async function init(){
  await loadSystem();
  loadCustomers();
}

async function loadSystem(){
  try{
    const res = await fetch('/regulatory/api/system');
    SYS = await res.json();
    if(!SYS.available){
      document.getElementById('content').innerHTML =
        `<div class="empty"><div style="font-size:34px;margin-bottom:12px">📋</div>
         <div style="font-weight:600;color:var(--t2);margin-bottom:6px">No regulatory reports yet</div>
         <div style="font-size:12px;margin-bottom:18px">${esc(SYS.message||'')}</div>
         <button class="btn btn-primary" onclick="runBatch()">↻ Run the Regulatory Batch</button></div>`;
      return;
    }
    document.getElementById('reportDate').textContent = 'Report date: '+SYS.report_date;
    buildBankNav();
    showSystem();
  }catch(e){
    document.getElementById('content').innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
  }
}

async function loadCustomers(){
  try{
    const res = await fetch('/operations/api/customers');
    CUSTOMERS = await res.json();
    document.getElementById('clientList').innerHTML =
      CUSTOMERS.map(c=>`<option value="${c.first} ${c.last} — ${c.id}">`).join('');
  }catch(e){ /* non-fatal */ }
}

function buildBankNav(){
  document.getElementById('bankNav').innerHTML = SYS.banks.map(b=>{
    const worst = [b.car_status,b.lcr_status,b.nsfr_status].includes('Breach') ? 'Breach'
                : [b.car_status,b.lcr_status,b.nsfr_status].includes('Watch') ? 'Watch' : 'Compliant';
    return `<div class="nav-item" id="nav-${b.bank_id}" onclick="showBank('${b.bank_id}')">
      <div class="ni-icon">${esc((b.bank_name||'').substring(0,2).toUpperCase())}</div>
      <div class="ni-text"><div class="ni-label">${esc(b.bank_name)}</div>
        <div class="ni-sub">CAR ${pct(b.car)} · LCR ${pct(b.lcr)}</div></div>
      <div class="ni-dot ${worst}"></div>
    </div>`;
  }).join('');
}

function setActive(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+id); if(el) el.classList.add('active');
}

// ════════════════════════════════════════════════════════════════════════════
// SYSTEM VIEW
// ════════════════════════════════════════════════════════════════════════════
function showSystem(){
  setActive('system');
  destroyCharts();
  const s = SYS.system, th = SYS.thresholds;
  const carStatus = s.car>=th.car_min?(s.car<th.car_min+1?'Watch':'Compliant'):'Breach';
  const lcrStatus = s.lcr>=th.lcr_min?(s.lcr<th.lcr_min+10?'Watch':'Compliant'):'Breach';
  const nsfrStatus= s.nsfr>=th.nsfr_min?(s.nsfr<th.nsfr_min+10?'Watch':'Compliant'):'Breach';

  document.getElementById('content').innerHTML = `
  <div class="page-head">
    <div>
      <div class="page-title">India Banking System</div>
      <div class="page-desc">Consolidated Basel III capital adequacy, liquidity and RBI compliance across all supervised banks. Computed daily from the live loan book, deposit base and risk metrics.</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--t3)">Supervised banks</div>
      <div style="font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:30px;color:var(--red)">${s.num_banks}</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card ${statusColor(carStatus)}">
      <div class="kpi-badge badge ${carStatus}">${carStatus}</div>

// per-bank total capital isn't in the system summary rows; pull from bank reports
async function fillCapitalSeries(){
  try{
    const caps = await Promise.all(SYS.banks.map(b=>fetch(`/regulatory/api/banks/${b.bank_id}`).then(r=>r.json())));
    if(charts.cap){
      charts.cap.data.datasets[1].data = caps.map(c=>c.capital ? c.capital.total_capital/1e7 : 0);
      charts.cap.update();
    }
  }catch(e){}
}

function lookupClient(val){
  if(!val) return;
  const m = val.match(/—\s*(\S+)\s*$/);
  const cid = m ? m[1] : (CUSTOMERS.find(c=>`${c.first} ${c.last}`.toLowerCase()===val.toLowerCase())||{}).id;
  if(cid) lookupClientById(cid);
  else showToast('Customer not found — pick from the list','error');
}

  setActive('');

  if(data.error){ document.getElementById('content').innerHTML=`<div class="empty">${esc(data.error)}</div>`; return; }
  const cu=data.customer, b=data.bank, t=data.totals, th=data.thresholds;
  const npaFlag = t.num_npa>0;

  document.getElementById('content').innerHTML = `
  <div class="page-head">
    <div>
      <div class="page-title">${esc(cu.first)} ${esc(cu.last)}</div>
      <div class="page-desc">Client-level regulatory exposure report · ${esc(cu.id)} · ${esc(b?b.bank_name:'')} · ${esc(cu.city)}, ${esc(cu.state)}. Regulatory capital &amp; provisioning attributable to this borrower as at ${esc(data.report_date||'—')}.</div>
    </div>
    <div><span class="badge ${npaFlag?'Breach':'Compliant'}" style="font-size:11px;padding:5px 14px">${npaFlag?'NPA Exposure':'Standard Exposure'}</span></div>

  <div class="kpi-grid">
    <div class="kpi-card blue"><div class="kpi-label">Exposure at Default</div><div class="kpi-value" style="font-size:24px">${inr(t.ead)}</div><div class="kpi-sub">${t.num_loans} loan${t.num_loans!==1?'s':''}</div></div>
    <div class="kpi-card red"><div class="kpi-label">Risk-Weighted Assets</div><div class="kpi-value" style="font-size:24px">${inr(t.rwa)}</div><div class="kpi-sub">Capital charge ${inr(t.capital_charge)}</div></div>
    <div class="kpi-card amber"><div class="kpi-label">Expected Loss</div><div class="kpi-value" style="font-size:24px">${inr(t.expected_loss)}</div><div class="kpi-sub">PD × LGD × EAD</div></div>
    <div class="kpi-card ${npaFlag?'red':'green'}"><div class="kpi-label">Provision Held</div><div class="kpi-value" style="font-size:24px">${inr(t.provision)}</div><div class="kpi-sub">${t.num_npa} NPA loan${t.num_npa!==1?'s':''} (IRAC)</div></div>
  </div>

  <div>
    <div class="sl">Exposure Register</div>
    <div class="card">
      ${(data.exposures&&data.exposures.length)?`<table class="tbl">
        <thead><tr><th>Loan ID</th><th>Product</th><th>Class</th><th class="th-num">EAD</th><th class="th-num">PD</th><th class="th-num">LGD</th><th class="th-num">Risk Wt</th><th class="th-num">RWA</th><th class="th-num">Capital</th><th class="th-num">Exp. Loss</th><th class="th-num">Provision</th></tr></thead>
        <tbody>${data.exposures.map(e=>`<tr>
          <td style="font-family:'IBM Plex Mono';font-size:11px">${esc(e.loan_id)}</td>
          <td>${esc(e.loan_type)}</td>
          <td><span class="badge ${e.classification==='Standard'?'Compliant':'Breach'}" style="font-size:8.5px">${esc(e.classification)}</span></td>
          <td class="num">${inr(e.ead)}</td>
          <td class="num">${(e.pd*100).toFixed(2)}%</td>
          <td class="num">${(e.lgd*100).toFixed(0)}%</td>
          <td class="num">${e.risk_weight}%</td>
          <td class="num">${inr(e.rwa)}</td>
          <td class="num">${inr(e.capital_charge)}</td>
          <td class="num">${inr(e.expected_loss)}</td>
          <td class="num">${inr(e.provision)}</td>
        </tr>`).join('')}</tbody>
      </table>`:'<div class="empty">No loan exposures on record for this customer.</div>'}
    </div>
  </div>

  <div class="assume">
    <div class="assume-title">📐 How these figures are derived</div>
    <strong>RWA</strong> = EAD × RBI Standardised-Approach risk weight (by product; 150% for NPAs). <strong>Capital charge</strong> = RWA × ${th?th.car_min:11.5}% (CRAR floor incl. capital conservation buffer). <strong>Expected Loss</strong> = PD × LGD × EAD. <strong>Provision</strong> follows RBI IRAC norms (0.40% standard assets, 15%+ for NPAs). PD is the model-observed probability of default; LGD is the downturn loss-given-default by collateral type.
  </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// RUN BATCH
// ════════════════════════════════════════════════════════════════════════════
async function runBatch(){
  const btn=document.getElementById('runBtn');
  btn.disabled=true; btn.textContent='Running…';
  try{
    const res = await fetch('/regulatory/api/run-batch',{method:'POST'});
    const j = await res.json();
    if(j.success){ showToast(`Batch complete — ${j.banks_processed} banks recomputed`,'success'); await loadSystem(); }
    else showToast('Batch failed: '+(j.error||'unknown'),'error');
  }catch(e){ showToast('Batch failed: '+e.message,'error'); }
  finally{ btn.disabled=false; btn.textContent='↻ Run Batch'; }
}

init();
</script>
</body>
</html>
