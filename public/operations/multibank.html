<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Bank Dashboard — India Banking Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0D1B2A;--navy2:#162233;--navy3:#1E3048;
  --red:#E31837;--red-dk:#B01229;
  --white:#FFFFFF;--off:#F4F6FA;--border:#E2E8F0;
  --t1:#0D1B2A;--t2:#4A5568;--t3:#8A9AB0;
  --green:#10B981;--amber:#F59E0B;--sidebar:290px;
}

body{font-family:'IBM Plex Sans',sans-serif;background:var(--off);color:var(--t1);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOP BANK SELECTOR */
.bankbar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;height:48px;display:flex;align-items:center;gap:20px;flex-shrink:0;z-index:15}
.bank-selector-label{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--t3);letter-spacing:1px}
.bank-selector{padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#fff;cursor:pointer;color:var(--t1);transition:border-color 0.2s}
.bank-selector:hover{border-color:var(--red)}

/* MAIN LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;z-index:20}
.sidebar::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(227,24,55,0.07) 0%,transparent 60%),radial-gradient(ellipse at 90% 80%,rgba(26,107,255,0.05) 0%,transparent 60%);pointer-events:none}
.sidebar-header{padding:18px 22px 14px;border-bottom:1px solid rgba(255,255,255,0.07);position:relative;z-index:1}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-mark{width:36px;height:36px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(227,24,55,0.4)}
.logo-text{display:flex;flex-direction:column}
.logo-name{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:13px;color:#fff;line-height:1.2}
.logo-sub{font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:0.8px;text-transform:uppercase;margin-top:1px}

/* BANK INFO CARD */
.bank-info-card{background:rgba(227,24,55,0.15);border-radius:10px;margin:12px 10px;padding:12px;border:1px solid rgba(227,24,55,0.2);position:relative;z-index:1}
.bank-info-title{font-size:9px;font-weight:600;text-transform:uppercase;color:rgba(255,255,255,0.4);letter-spacing:1px;margin-bottom:6px}
.bank-info-name{font-size:12px;font-weight:600;color:#fff;margin-bottom:4px}
.bank-info-detail{font-size:10px;color:rgba(255,255,255,0.65);margin-bottom:2px}
.bank-info-detail strong{font-weight:600}

.sidebar-section-label{padding:12px 22px 6px;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.25);position:relative;z-index:1}
.customer-list{flex:1;overflow-y:auto;padding:4px 10px 10px;scrollbar-width:none;position:relative;z-index:1}
.customer-list::-webkit-scrollbar{display:none}
.cust-card{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;cursor:pointer;transition:background 0.15s;margin-bottom:3px;border:1px solid transparent}
.cust-card:hover{background:rgba(255,255,255,0.05)}
.cust-card.active{background:rgba(227,24,55,0.13);border-color:rgba(227,24,55,0.28)}
.cust-card.active .cname{color:#fff}
.cust-card.active .c-avatar{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(227,24,55,0.4)}
.c-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:11px;color:rgba(255,255,255,0.6);flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:12px;font-weight:500;color:rgba(255,255,255,0.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccity{font-size:10px;color:rgba(255,255,255,0.3);margin-top:1px}
.h-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.h-dot.good{background:var(--green);box-shadow:0 0 4px rgba(16,185,129,0.5)}
.h-dot.watch{background:var(--amber);box-shadow:0 0 4px rgba(245,158,11,0.5)}
.h-dot.def{background:var(--red);box-shadow:0 0 4px rgba(227,24,55,0.5)}
.sidebar-footer{padding:12px 22px;border-top:1px solid rgba(255,255,255,0.06);font-size:9px;color:rgba(255,255,255,0.2);position:relative;z-index:1}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-title{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:15px;color:var(--t1)}
.topbar-pill{font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;letter-spacing:0.3px}
.topbar-date{font-size:11px;color:var(--t3);font-family:'IBM Plex Mono',monospace}
.content{padding:24px 32px 40px;display:flex;flex-direction:column;gap:24px}

/* SECTION LABEL */
.sl{font-size:9.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}

/* BANK OVERVIEW */
.bank-overview-card{background:#fff;border-radius:14px;padding:24px;border:1px solid var(--border)}
.bank-overview-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.bank-overview-logo{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy3));display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:20px;color:#fff;flex-shrink:0}
.bank-overview-info{flex:1}
.bank-overview-name{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:20px;color:var(--t1);margin-bottom:8px}
.bank-overview-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:12px}
.meta-item{display:flex;flex-direction:column;gap:2px}
.meta-label{font-size:9px;font-weight:600;text-transform:uppercase;color:var(--t3)}
.meta-value{font-size:13px;color:var(--t2);font-weight:500}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;bottom:0;right:0;width:70px;height:70px;border-radius:50%;opacity:0.05}
.kpi-card.red::before{background:var(--red)}
.kpi-card.green::before{background:var(--green)}
.kpi-card.amber::before{background:var(--amber)}
.kpi-icon{font-size:18px;margin-bottom:10px}
.kpi-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:5px}
.kpi-value{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:24px;color:var(--t1);line-height:1}

/* PROFILE */
.profile-card{background:#fff;border-radius:14px;padding:24px;display:flex;align-items:flex-start;gap:20px;border:1px solid var(--border);position:relative;overflow:hidden}
.profile-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),#FF6B6B)}
.p-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy3));display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:20px;color:#fff;flex-shrink:0}
.p-main{flex:1}
.p-name{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:19px;color:var(--t1);margin-bottom:10px}
.p-meta{display:flex;gap:16px;flex-wrap:wrap}
.meta-item{display:flex;flex-direction:column;gap:2px}
.meta-label{font-size:9px;font-weight:600;text-transform:uppercase;color:var(--t3)}
.meta-value{font-size:12px;color:var(--t2);font-weight:500}
.p-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.h-badge{padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600}
.h-badge.good{background:#D1FAE5;color:#065F46}
.h-badge.watch{background:#FEF3C7;color:#92400E}
.h-badge.def{background:#FEE2E2;color:#991B1B}

/* ACCOUNTS & LOANS */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.acc-card{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--border)}
.acc-balance{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:18px;color:var(--t1);margin-bottom:4px}
.acc-id{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3)}
.loans-list{display:flex;flex-direction:column;gap:12px}
.loan-card{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--border)}
.loan-title{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;color:var(--t1);margin-bottom:8px}
.loan-stat{font-size:11px;display:flex;justify-content:space-between;margin-bottom:4px}

/* CHARTS */
.dash-charts-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.dash-chart-card{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--border)}
.dash-chart-title{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;color:var(--t1);margin-bottom:12px}

/* TRANSACTIONS TABLE */
.txn-table{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-top:12px}
.txn-row{display:grid;grid-template-columns:100px 60px 100px 1fr 100px;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);font-size:11px}
.txn-row:last-child{border-bottom:none}
.txn-row.hdr{background:#FAFBFD;font-weight:600;color:var(--t3);font-size:9px;text-transform:uppercase;letter-spacing:0.8px}
.txn-amt{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right}
.txn-amt.cr{color:var(--green)}
.txn-amt.dr{color:var(--red)}

@media(max-width:960px){
  :root{--sidebar:240px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .dash-charts-row{grid-template-columns:1fr}
}
@media(max-width:640px){
  .layout{flex-direction:column}
  .sidebar{width:100%;min-width:100%;height:auto;max-height:200px}
  .kpi-grid{grid-template-columns:1fr}
  .content{padding:16px}
}
</style>
</head>
<body>

<div class="bankbar">
  <span class="bank-selector-label">Select Bank:</span>
  <select class="bank-selector" id="bankDropdown" onchange="selectBank(this.value)">
    <option value="">Loading banks...</option>
  </select>
</div>

<div class="layout">
<aside class="sidebar">
  <div class="sidebar-header"><a href="/" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:rgba(255,255,255,0.5);font-size:0.75em;margin-bottom:10px;letter-spacing:0.5px;" title="Back to Platform Home">← Platform Home</a>
    <div class="logo-row">
      <div class="logo-mark">IB</div>
      <div class="logo-text">
        <div class="logo-name">India Banking</div>
        <div class="logo-sub">Multi-Bank Intel</div>
      </div>
    </div>
  </div>
  <div id="bankInfoCard" class="bank-info-card" style="display:none">
    <div class="bank-info-title">Current Bank</div>
    <div class="bank-info-name" id="bankInfoName">—</div>
    <div class="bank-info-detail"><strong id="bankInfoCode">—</strong></div>
    <div class="bank-info-detail">HQ: <span id="bankInfoCity">—</span></div>
  </div>
  <div style="margin:8px 10px;position:relative;z-index:1">
    <button onclick="showSystemDashboard()" style="width:100%;padding:10px;border:1px solid rgba(227,24,55,0.3);background:rgba(227,24,55,0.1);border-radius:8px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s">📊 System Dashboard</button>
  </div>
  <div class="sidebar-section-label">Customers</div>
  <div class="customer-list" id="custList">
    <div class="spinner" style="padding:20px">Loading customers...</div>
  </div>
  <div class="sidebar-footer" id="sidebarFooter">India Banking Intelligence</div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title" id="topTitle">Bank Dashboard</div>
      <div id="topPill"></div>
    </div>
    <div class="topbar-date" id="topDate"></div>
  </div>
  <div class="content" id="mainContent">
    <div class="spinner" style="padding:60px">Loading dashboard...</div>
  </div>
</main>
</div>

<script>
// ── STATE ───────────────────────────────────────────────────────────────────
let selectedBankId = null;
let banksData = [];
const dashCharts = {};

// ── UTILS ───────────────────────────────────────────────────────────────────
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits: 0});
// Indian short form: ₹X.XX Cr / L / K (compact KPI display)
const inrShort = n => {
  n = Number(n || 0); const a = Math.abs(n);
  if (a >= 1e7) return '₹' + (n/1e7).toFixed(2) + ' Cr';
  if (a >= 1e5) return '₹' + (n/1e5).toFixed(2) + ' L';
  if (a >= 1e3) return '₹' + (n/1e3).toFixed(1) + ' K';
  return inr(n);
};
const fmtDate = d => {
  if (!d) return '—';
  try { return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}); }
  catch { return d; }
};
const initials = c => ((c.first || '')[0] || '') + ((c.last || '')[0] || '');
const healthLabel = {good: 'Good Standing', watch: 'Under Watch', def: 'Defaulted'};

function age(dob) {
  if (!dob) return '?';
  const b = new Date(dob), n = new Date();
  return n.getFullYear() - b.getFullYear() - (n < new Date(n.getFullYear(), b.getMonth(), b.getDate()) ? 1 : 0);
}

// ── LOAD BANKS ───────────────────────────────────────────────────────────────
async function loadBanks() {
  const res = await fetch('/operations/api/banks');
  banksData = await res.json();

  const sel = document.getElementById('bankDropdown');
  sel.innerHTML = '<option value="ALL">All Banks (System View)</option>' +
                  banksData.map(b => `<option value="${b.bank_id}">${b.bank_name}</option>`).join('');

  if (banksData.length > 0) {
    selectedBankId = banksData[0].bank_id;
    sel.value = selectedBankId;
    selectBank(selectedBankId);
  }
}

// ── SELECT BANK ──────────────────────────────────────────────────────────────
async function selectBank(bankId) {
  selectedBankId = bankId;

  if (bankId === 'ALL') {
    showSystemDashboard();
    return;
  }

  const bank = banksData.find(b => b.bank_id === bankId);
  if (!bank) return;

  // Update bank info card
  document.getElementById('bankInfoCard').style.display = 'block';
  document.getElementById('bankInfoName').textContent = bank.bank_name;
  document.getElementById('bankInfoCode').textContent = `Code: ${bank.bank_code || '—'}`;
  document.getElementById('bankInfoCity').textContent = bank.headquarters_city || '—';

  // Load customers for this bank
  loadBankCustomers(bankId);

  // Load bank dashboard (main view)
  showBankDashboard(bankId);
}

// ── LOAD BANK CUSTOMERS ──────────────────────────────────────────────────────
async function loadBankCustomers(bankId) {
  const res = await fetch(`/operations/api/banks/${bankId}/customers`);
  const customers = await res.json();

  const custListHtml = customers.map(c => `
    <div class="cust-card" id="cc-${c.id}" onclick="selectCustomer('${c.id}')">
      <div class="c-avatar">${initials(c)}</div>
      <div class="cinfo">
        <div class="cname">${c.first} ${c.last}</div>
        <div class="ccity">${c.city || ''}</div>
      </div>
      <div class="h-dot ${c.health}"></div>
    </div>
  `).join('');

  document.getElementById('custList').innerHTML = custListHtml || '<div style="padding:20px;color:rgba(255,255,255,0.5);text-align:center">No customers</div>';
  document.getElementById('sidebarFooter').textContent = `${customers.length} customers`;
}

// ── SELECT CUSTOMER ──────────────────────────────────────────────────────────
async function selectCustomer(cid) {
  document.querySelectorAll('.cust-card').forEach(el => el.classList.remove('active'));
  const ccEl = document.getElementById('cc-' + cid);
  if (ccEl) ccEl.classList.add('active');

  const res = await fetch(`/operations/api/customers/${cid}`);
  const {customer: c, accounts, loans, transactions} = await res.json();

  document.getElementById('topTitle').textContent = `${c.first} ${c.last} — Customer Detail`;
  document.getElementById('topPill').innerHTML = `<span class="topbar-pill h-badge ${c.health}">${healthLabel[c.health]}</span>`;

  // Build customer detail view
  const html = `
    <div class="sl">Customer Profile</div>
    <div class="profile-card">
      <div class="p-avatar">${initials(c)}</div>
      <div class="p-main">
        <div class="p-name">${c.first} ${c.last}</div>
        <div class="p-meta">
          <div class="meta-item"><div class="meta-label">Customer ID</div><div class="meta-value">${c.id}</div></div>
          <div class="meta-item"><div class="meta-label">Age / Gender</div><div class="meta-value">${age(c.dob)} yrs · ${c.gender || '—'}</div></div>
          <div class="meta-item"><div class="meta-label">City / State</div><div class="meta-value">${c.city || '—'} · ${c.state || '—'}</div></div>
          <div class="meta-item"><div class="meta-label">Member Since</div><div class="meta-value">${fmtDate(c.joined)}</div></div>
        </div>
      </div>
      <div class="p-right">
        <span class="h-badge ${c.health}">${healthLabel[c.health]}</span>
      </div>
    </div>

    <div class="sl">Accounts (${accounts.length})</div>
    <div class="acc-grid">
      ${accounts.map(a => `
        <div class="acc-card">
          <div class="acc-balance">${inr(a.balance)}</div>
          <div class="acc-id">${a.id}</div>
          <div class="meta-label" style="margin-top:8px;color:#8A9AB0">Type: ${a.type}</div>
        </div>
      `).join('')}
    </div>

    <div class="sl">Loans (${loans.length})</div>
    <div class="loans-list">
      ${loans.map(l => `
        <div class="loan-card">
          <div class="loan-title">${l.type}</div>
          <div class="loan-stat"><span>Principal:</span><span>${inr(l.principal)}</span></div>
          <div class="loan-stat"><span>Outstanding:</span><span>${inr(l.outstanding)}</span></div>
          <div class="loan-stat"><span>Rate:</span><span>${l.rate}%</span></div>
        </div>
      `).join('') || '<div style="color:var(--t3)">No loans</div>'}
    </div>

    <div class="sl">All Transactions (${transactions.length} total)</div>
    <div class="txn-table">
      <div class="txn-row hdr">
        <div>Date</div>
        <div>Type</div>
        <div>Amount</div>
        <div>Description</div>
        <div>Balance</div>
      </div>
      ${transactions.sort((a, b) => new Date(b.date) - new Date(a.date)).map(t => `
        <div class="txn-row">
          <div>${fmtDate(t.date)}</div>
          <div>${t.type}</div>
          <div class="txn-amt ${t.type === 'Deposit' ? 'cr' : 'dr'}">${inr(t.amount)}</div>
          <div>${t.desc || '—'}</div>
          <div>${inr(t.balance_after)}</div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;
}

// ── SHOW BANK DASHBOARD ──────────────────────────────────────────────────────
async function showBankDashboard(bankId) {
  const res = await fetch(`/operations/api/banks/${bankId}/dashboard`);
  const {bank, kpis, health, txnByHour} = await res.json();

  document.getElementById('topTitle').textContent = `${bank.bank_name} — Bank Dashboard`;
  document.getElementById('topPill').innerHTML = '';

  // Destroy old charts
  Object.values(dashCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  Object.keys(dashCharts).forEach(k => delete dashCharts[k]);

  const html = `
    <div class="bank-overview-card">
      <div class="bank-overview-header">
        <div class="bank-overview-logo">${(bank.bank_name || '').substring(0, 2).toUpperCase()}</div>
        <div class="bank-overview-info">
          <div class="bank-overview-name">${bank.bank_name}</div>
          <div class="bank-overview-meta">
            <div class="meta-item"><div class="meta-label">RBI Code</div><div class="meta-value">${bank.bank_code}</div></div>
            <div class="meta-item"><div class="meta-label">HQ</div><div class="meta-value">${bank.headquarters_city}, ${bank.headquarters_state}</div></div>
            <div class="meta-item"><div class="meta-label">Est.</div><div class="meta-value">${bank.year_established}</div></div>
            <div class="meta-item"><div class="meta-label">Status</div><div class="meta-value">${bank.status}</div></div>
          </div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card green">
          <div class="kpi-icon">👥</div>
          <div class="kpi-label">Customers</div>
          <div class="kpi-value">${kpis.customers}</div>
        </div>
        <div class="kpi-card blue" style="--blue:#3B82F6">
          <div class="kpi-icon">🏦</div>
          <div class="kpi-label">Accounts</div>
          <div class="kpi-value">${kpis.accounts}</div>
        </div>
        <div class="kpi-card green">
          <div class="kpi-icon">💰</div>
          <div class="kpi-label">Total Deposits</div>
          <div class="kpi-value" title="${inr(kpis.totalDeposits)}">${inrShort(kpis.totalDeposits)}</div>
        </div>
        <div class="kpi-card amber">
          <div class="kpi-icon">📊</div>
          <div class="kpi-label">Outstanding Loans</div>
          <div class="kpi-value" title="${inr(kpis.totalOutstanding)}">${inrShort(kpis.totalOutstanding)}</div>
        </div>
      </div>
    </div>

    <div class="dash-charts-row">
      <div class="dash-chart-card">
        <div class="dash-chart-title">Transactions by Hour</div>
        <canvas id="bankTxnHourChart"></canvas>
      </div>
      <div class="dash-chart-card">
        <div class="dash-chart-title">Loan Health Distribution</div>
        <div style="padding:20px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:var(--green)">${health.good}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Good Standing</div>
          <div style="font-size:28px;font-weight:700;color:var(--amber);margin-top:12px">${health.watch}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Under Watch</div>
          <div style="font-size:28px;font-weight:700;color:var(--red);margin-top:12px">${health.def}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Defaulted</div>
        </div>
      </div>
    </div>

    <div class="sl">Customers in ${bank.bank_name}</div>
    <div id="bankCustomersGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
      Loading...
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  // Load customers for this bank and display them
  const custRes = await fetch(`/operations/api/banks/${bankId}/customers`);
  const customers = await custRes.json();

  const custGridHtml = customers.map(c => `
    <div style="background:#fff;border-radius:12px;padding:14px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s" onclick="selectCustomer('${c.id}')">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px">${initials(c)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px;color:var(--t1)">${c.first} ${c.last}</div>
          <div style="font-size:11px;color:var(--t3)">${c.city}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--off);border-radius:6px;justify-content:space-between">
        <span style="font-size:10px;color:var(--t3)">Health:</span>
        <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:${c.health === 'good' ? '#D1FAE5;color:#065F46' : c.health === 'watch' ? '#FEF3C7;color:#92400E' : '#FEE2E2;color:#991B1B'}">${healthLabel[c.health]}</span>
      </div>
    </div>
  `).join('');

  document.getElementById('bankCustomersGrid').innerHTML = custGridHtml || '<div style="color:var(--t3)">No customers</div>';

  // Create charts
  setTimeout(() => {
    const ctx = document.getElementById('bankTxnHourChart');
    if (ctx) {
      dashCharts.bankHour = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Array.from({length:24}, (_, i) => i + ':00'),
          datasets: [{
            label: 'Transactions',
            data: txnByHour,
            backgroundColor: 'rgba(227,24,55,0.7)',
            borderColor: 'rgba(227,24,55,1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {legend: {display: false}},
          scales: {y: {beginAtZero: true}}
        }
      });
    }
  }, 100);
}

// ── SYSTEM DASHBOARD ─────────────────────────────────────────────────────────
async function showSystemDashboard() {
  document.querySelectorAll('.cust-card').forEach(el => el.classList.remove('active'));
  document.getElementById('bankInfoCard').style.display = 'none';

  const res = await fetch('/operations/api/system-dashboard');
  const {title, banks, kpis, health, txnByHour} = await res.json();

  document.getElementById('topTitle').textContent = title;
  document.getElementById('topPill').innerHTML = '';

  // Destroy old charts
  Object.values(dashCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  Object.keys(dashCharts).forEach(k => delete dashCharts[k]);

  // Build system overview
  const bankRows = banks.map(b => `
    <tr style="border-bottom:1px solid var(--border);font-size:12px">
      <td style="padding:10px">${b.bank_name}</td>
      <td style="padding:10px;text-align:right">${b.customers}</td>
      <td style="padding:10px;text-align:right">${b.accounts}</td>
      <td style="padding:10px;text-align:right" title="${inr(b.deposits)}">${inrShort(b.deposits)}</td>
    </tr>
  `).join('');

  const html = `
    <div class="bank-overview-card">
      <div style="margin-bottom:16px">
        <div style="font-size:20px;font-weight:700;color:var(--t1);margin-bottom:12px">India Banking System Overview</div>
        <p style="color:var(--t3);font-size:12px">Aggregated data across all banks and institutions</p>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card green">
          <div class="kpi-icon">🏦</div>
          <div class="kpi-label">Total Banks</div>
          <div class="kpi-value">${banks.length}</div>
        </div>
        <div class="kpi-card green">
          <div class="kpi-icon">👥</div>
          <div class="kpi-label">All Customers</div>
          <div class="kpi-value">${kpis.customers}</div>
        </div>
        <div class="kpi-card blue" style="--blue:#3B82F6">
          <div class="kpi-icon">💳</div>
          <div class="kpi-label">All Accounts</div>
          <div class="kpi-value">${kpis.accounts}</div>
        </div>
        <div class="kpi-card green">
          <div class="kpi-icon">💰</div>
          <div class="kpi-label">Total Deposits</div>
          <div class="kpi-value" title="${inr(kpis.totalDeposits)}">${inrShort(kpis.totalDeposits)}</div>
        </div>
      </div>

      <div style="margin-top:24px;padding:16px;background:#FAFBFD;border-radius:10px;border:1px solid var(--border)">
        <div style="font-size:13px;font-weight:600;color:var(--t1);margin-bottom:12px">Bank-wise Summary</div>
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:#fff;border-bottom:2px solid var(--border);font-weight:600;font-size:11px;color:var(--t3);text-transform:uppercase">
              <th style="padding:10px;text-align:left">Bank Name</th>
              <th style="padding:10px;text-align:right">Customers</th>
              <th style="padding:10px;text-align:right">Accounts</th>
              <th style="padding:10px;text-align:right">Deposits</th>
            </tr>
          </thead>
          <tbody>
            ${bankRows}
          </tbody>
        </table>
      </div>
    </div>

    <div class="dash-charts-row">
      <div class="dash-chart-card">
        <div class="dash-chart-title">System-wide Transactions by Hour</div>
        <canvas id="sysTxnHourChart"></canvas>
      </div>
      <div class="dash-chart-card">
        <div class="dash-chart-title">Overall Health Distribution</div>
        <div style="padding:20px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:var(--green)">${health.good}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Good Standing</div>
          <div style="font-size:28px;font-weight:700;color:var(--amber);margin-top:12px">${health.watch}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Under Watch</div>
          <div style="font-size:28px;font-weight:700;color:var(--red);margin-top:12px">${health.def}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Defaulted</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  // Create chart
  setTimeout(() => {
    const ctx = document.getElementById('sysTxnHourChart');
    if (ctx) {
      dashCharts.sysHour = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Array.from({length:24}, (_, i) => i + ':00'),
          datasets: [{
            label: 'Transactions',
            data: txnByHour,
            backgroundColor: 'rgba(16,185,129,0.7)',
            borderColor: 'rgba(16,185,129,1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {legend: {display: false}},
          scales: {y: {beginAtZero: true}}
        }
      });
    }
  }, 100);
}

document.addEventListener('DOMContentLoaded', loadBanks);
